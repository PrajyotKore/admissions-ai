# UNTESTED on the author's machine (Docker was not installed). Frontend service is added with the frontend.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admissions
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admissions-dev}
      POSTGRES_DB: admissions
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admissions"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://admissions:${POSTGRES_PASSWORD:-admissions-dev}@db:5432/admissions
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  pgdata:
